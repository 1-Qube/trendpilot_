[project]
name = "trendpilot"
version = "0.1.0"
description = "Local research agent for one company at a time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
trendpilot = "trendpilot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
